[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ziyu: exercise tests for parts Ziyu implements (see docs/backend_exercises.md)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM300"]  # false positive on UPPER_CASE module attributes

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["app"]

[tool.coverage.run]
source = ["app", "worker"]
