# Local stack:  cd backend && docker compose up --build
# More workers: docker compose up --build --scale worker=4
name: pitchlab

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://pitchlab:pitchlab@postgres:5432/pitchlab
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/storage
  ANALYZER: ${ANALYZER:-fake}
  FAKE_ANALYZER_SECONDS: ${FAKE_ANALYZER_SECONDS:-2.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchlab
      POSTGRES_PASSWORD: pitchlab
      POSTGRES_DB: pitchlab
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchlab -d pitchlab"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations run once, before api/worker start (not inside each api replica).
  migrate:
    build: {context: .., dockerfile: backend/Dockerfile.api}
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: .., dockerfile: backend/Dockerfile.api}
    environment: *app-env
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
      args:
        INSTALL_ANALYZER: ${INSTALL_ANALYZER:-false}
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  storage:
